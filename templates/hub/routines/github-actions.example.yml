# Copy to .github/workflows/qa-nightly.yml in the hub repo.
# Secrets: ANTHROPIC_API_KEY, and each test-account password under the env name used in registry.yaml.
name: QA nightly
on:
  schedule:
    - cron: '30 18 * * *'   # 01:30 in UTC+7; cron here is always UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx -y @anthropic-ai/claude-code@2.1.296 -p "$(cat routines/nightly.prompt.md)" --settings routines/permissions.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          QA_ENV: staging
          # APP_MANAGER_PASSWORD: ${{ secrets.APP_MANAGER_PASSWORD }}
