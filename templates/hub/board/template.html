<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Board</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #0f766e; --brand-2: #14b8a6;
    --amber: #b45309; --amber-bg: #fef3c7; --red: #b91c1c; --red-bg: #fee2e2; --green: #15803d; --green-bg: #dcfce7; --blue: #1d4ed8; --blue-bg: #dbeafe;
    --code: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120; --panel: #111827; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2a3d; --brand: #2dd4bf; --brand-2: #14b8a6;
      --amber: #fbbf24; --amber-bg: #3a2a0a; --red: #fca5a5; --red-bg: #3b1212; --green: #86efac; --green-bg: #0f2e1b; --blue: #93c5fd; --blue-bg: #13233f;
      --code: #0f172a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1120; --panel: #111827; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2a3d; --brand: #2dd4bf; --brand-2: #14b8a6;
    --amber: #fbbf24; --amber-bg: #3a2a0a; --red: #fca5a5; --red-bg: #3b1212; --green: #86efac; --green-bg: #0f2e1b; --blue: #93c5fd; --blue-bg: #13233f;
    --code: #0f172a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; }
  nav.tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--bg); font-weight: 600; }
  main { padding: 20px 24px 48px; max-width: 1400px; margin: 0 auto; }
  .banner { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; border: 1px solid var(--line); background: var(--panel); }
  .banner strong { font-size: 15px; }
  .banner.complete { border-left: 5px solid var(--green); }
  .banner.inconclusive { border-left: 5px solid var(--amber); }
  .banner.aborted { border-left: 5px solid var(--red); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sev-critical { background: var(--red); color: var(--bg); } .sev-high { background: var(--red-bg); color: var(--red); }
  .sev-medium { background: var(--amber-bg); color: var(--amber); } .sev-low { background: var(--blue-bg); color: var(--blue); }
  .st-open { background: var(--red-bg); color: var(--red); } .st-fixed { background: var(--green-bg); color: var(--green); }
  .st-wontfix, .st-by-design { background: var(--code); color: var(--muted); }
  .r-passed, .r-complete { background: var(--green-bg); color: var(--green); } .r-new-regression, .r-error, .r-aborted { background: var(--red); color: var(--bg); }
  .r-known-bug-open, .r-inconclusive { background: var(--amber-bg); color: var(--amber); } .r-possibly-fixed { background: var(--blue-bg); color: var(--blue); }
  .r-flaky, .r-skipped, .r-none { background: var(--code); color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters select, .filters input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .filters input { min-width: 220px; flex: 1; }
  .split { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 18px; align-items: start; }
  .list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .list button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); padding: 10px 14px; font: inherit; cursor: pointer; }
  .list button:last-child { border-bottom: 0; }
  .list button[aria-current="true"] { background: var(--code); box-shadow: inset 4px 0 0 var(--brand); }
  .list .id { font-weight: 700; margin-right: 6px; }
  .list .meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .detail { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 18px 22px; min-height: 300px; }
  .detail h2 { margin: 0 0 6px; font-size: 19px; }
  .detail h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .detail video { width: 100%; max-height: 420px; border-radius: 8px; background: #000; margin-top: 8px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  ol { padding-left: 20px; margin: 4px 0; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; max-height: 360px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 0; background: var(--brand); color: var(--bg); padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .copied { color: var(--green); font-weight: 600; align-self: center; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  a { color: var(--brand); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; }
  @media (max-width: 860px) {
    .split { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    nav.tabs { margin-left: 0; }
    main { padding: 16px; }
    .kv { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hub-name">QA Board</h1>
    <div class="sub" id="generated"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="bugs" aria-selected="true">Bugs</button>
    <button role="tab" data-tab="runs" aria-selected="false">Runs</button>
    <button role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
  </nav>
</header>
<main>
  <div id="latest"></div>
  <section id="tab-bugs">
    <div class="filters">
      <select id="f-app" aria-label="App"></select>
      <select id="f-sev" aria-label="Severity"><option value="">All severities</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select>
      <select id="f-state" aria-label="State"><option value="">All states</option><option selected>open</option><option>fixed</option><option>wontfix</option><option>by-design</option></select>
      <input id="f-q" type="search" placeholder="Search title, area, requirement…" aria-label="Search">
    </div>
    <div class="split">
      <div class="list" id="bug-list"></div>
      <article class="detail" id="bug-detail"></article>
    </div>
  </section>
  <section id="tab-runs" hidden></section>
  <section id="tab-coverage" hidden></section>
</main>
<footer>Built with the Ownership Framework QA skills</footer>
<script>
(function () {
  const DATA = /*__BOARD_DATA__*/null;
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : String(kid));
    return n;
  };
  const pill = (cls, text) => el('span', { class: 'pill ' + cls }, text);
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short', timeZone: DATA.timezone }) : '–');
  const isUrl = (s) => /^https?:\/\//.test(s || '');
  const link = (href, text) => (href ? el('a', { href: isUrl(href) ? href : DATA.videoBase + href, target: '_blank', rel: 'noopener' }, text || href) : text || '–');

  $('#hub-name').textContent = DATA.hub;
  document.title = DATA.hub + ' · QA Board';
  $('#generated').textContent = 'Built ' + fmt(DATA.generated) + ' · ' + DATA.timezone;

  // Latest run banner
  const latest = DATA.runs[0];
  if (latest) {
    const s = latest.specs || {};
    const sum = Object.entries(s).map(([suite, x]) => `${suite}: ${x.passed || 0} passed, ${x['known-bug-open'] || 0} known bug, ${x['new-regression'] || 0} new regression`).join(' · ');
    $('#latest').append(el('div', { class: 'banner ' + latest.status },
      el('strong', {}, 'Latest run'), pill('r-' + latest.status, latest.status),
      el('span', {}, `${latest.app} · ${latest.mode} · ${latest.environment} · ${fmt(latest.started)}`),
      el('span', {}, 'Version ', el('code', {}, (latest.versions?.old || '–').slice(0, 8)), ' → ', el('code', {}, (latest.versions?.new || '–').slice(0, 8))),
      el('span', {}, `New findings: ${(latest.newFindings || []).join(', ') || 'none'}`),
      latest.possiblyFixed?.length ? el('span', {}, 'Possibly fixed: ', el('strong', {}, latest.possiblyFixed.join(', '))) : null,
      sum ? el('span', { class: 'sub' }, sum) : null));
  }

  // Tabs (remembered per viewer)
  const tabs = document.querySelectorAll('nav.tabs button');
  function showTab(name) {
    tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    for (const t of ['bugs', 'runs', 'coverage']) $('#tab-' + t).hidden = t !== name;
    try { localStorage.setItem('qa-board-tab', name); } catch (e) { /* storage blocked */ }
    if (location.hash.slice(1) !== name && !location.hash.startsWith('#bug=')) history.replaceState(null, '', '#' + name);
  }
  tabs.forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // Bugs
  const apps = [...new Set(DATA.bugs.map((b) => b.app))];
  $('#f-app').append(el('option', { value: '' }, 'All apps'), ...apps.map((a) => el('option', {}, a)));
  let current = null;
  function filtered() {
    const app = $('#f-app').value, sev = $('#f-sev').value, st = $('#f-state').value, q = $('#f-q').value.toLowerCase();
    return DATA.bugs.filter((b) => (!app || b.app === app) && (!sev || b.sev === sev) && (!st || b.state === st)
      && (!q || [b.id, b.title, b.area, b.summary, b.expected?.requirement, b.prd].join(' ').toLowerCase().includes(q)));
  }
  function renderList() {
    const list = filtered();
    const box = $('#bug-list');
    box.replaceChildren();
    if (!list.length) box.append(el('div', { class: 'empty' }, 'No bugs match these filters.'));
    for (const b of list) {
      box.append(el('button', { 'aria-current': String(current === b.id), 'data-bug': b.id, onclick: () => select(b.id) },
        el('span', { class: 'id' }, b.id), b.title,
        el('div', { class: 'meta' }, pill('sev-' + b.sev, b.sev), pill('st-' + b.state, b.state), el('span', { class: 'sub' }, b.app + ' · ' + b.area))));
    }
    if (!current && list[0]) select(list[0].id, true);
  }
  async function copy(text, note) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const t = el('textarea', {}, text);
      document.body.append(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    note.textContent = 'Copied';
    setTimeout(() => (note.textContent = ''), 2000);
  }
  function select(id, quiet) {
    current = id;
    const b = DATA.bugs.find((x) => x.id === id);
    document.querySelectorAll('#bug-list button').forEach((n) => n.setAttribute('aria-current', String(n.dataset.bug === id)));
    if (!quiet) history.replaceState(null, '', '#bug=' + id);
    const d = $('#bug-detail');
    d.replaceChildren();
    if (!b) return;
    const note = el('span', { class: 'copied', 'aria-live': 'polite' });
    d.append(
      el('h2', {}, b.id + ' · ' + b.title),
      el('div', { class: 'meta' }, pill('sev-' + b.sev, b.sev), ' ', pill('st-' + b.state, b.state), ' ', el('span', { class: 'sub' }, `${b.app} · ${b.area} · found ${b.foundAt} in run ${b.run} · ${b.environment}`)),
      el('p', {}, b.summary),
      el('div', { class: 'actions' },
        el('button', { class: 'btn', 'data-testid': 'copy-fix-prompt', onclick: () => copy(b.fixPrompt, note) }, 'Copy fix prompt'),
        el('button', { class: 'btn secondary', onclick: () => { const p = d.querySelector('pre.prompt'); p.hidden = !p.hidden; } }, 'Show fix prompt'),
        note),
      el('pre', { class: 'prompt', hidden: true }, b.fixPrompt),
      b.video ? el('video', { controls: true, preload: 'metadata', src: DATA.videoBase + b.video }) : el('p', { class: 'sub' }, 'No video yet.'),
      b.videoAfter ? el('div', {}, el('h3', {}, 'After fix'), el('video', { controls: true, preload: 'metadata', src: DATA.videoBase + b.videoAfter })) : null,
      el('h3', {}, 'Steps'), el('ol', {}, b.steps.map((s) => el('li', {}, s))),
      el('h3', {}, 'Expected vs actual'),
      el('dl', { class: 'kv' },
        el('dt', {}, 'Expected'), el('dd', {}, b.expected.text, ' ', b.expected.link ? link(b.expected.link, '(' + b.expected.requirement + ')') : '(' + b.expected.requirement + ')'),
        el('dt', {}, 'Actual'), el('dd', {}, b.actual),
        el('dt', {}, 'Story'), el('dd', {}, b.prd || '–')),
      el('h3', {}, 'How it was confirmed'),
      el('dl', { class: 'kv' },
        el('dt', {}, 'Response'), el('dd', {}, b.how.response),
        el('dt', {}, 'Stored state'), el('dd', {}, b.how.state),
        b.how.byDesignCheck ? el('dt', {}, 'Not by design') : null, b.how.byDesignCheck ? el('dd', {}, b.how.byDesignCheck) : null),
      el('h3', {}, 'Where'),
      el('dl', { class: 'kv' },
        el('dt', {}, 'Code'), el('dd', {}, b.where?.file ? el('code', {}, b.where.file + (b.where.function ? ' › ' + b.where.function : '')) : 'not known yet'),
        el('dt', {}, 'Regression spec'), el('dd', {}, b.spec ? el('code', {}, b.spec) : '–'),
        el('dt', {}, 'Related'), el('dd', {}, (b.related || []).join(', ') || '–')),
    );
  }
  ['#f-app', '#f-sev', '#f-state'].forEach((s) => $(s).addEventListener('change', () => { current = null; renderList(); }));
  $('#f-q').addEventListener('input', () => { current = null; renderList(); });

  // Runs
  const runsBox = $('#tab-runs');
  if (!DATA.runs.length) runsBox.append(el('div', { class: 'empty' }, 'No runs yet.'));
  else {
    runsBox.append(el('table', {},
      el('thead', {}, el('tr', {}, ['Run', 'App', 'Mode', 'Env', 'Status', 'Versions', 'Specs', 'New findings', 'Possibly fixed', 'Not explored'].map((h) => el('th', {}, h)))),
      el('tbody', {}, DATA.runs.map((r) => el('tr', {},
        el('td', {}, el('strong', {}, r.runId), el('div', { class: 'sub' }, fmt(r.started))),
        el('td', {}, r.app), el('td', {}, r.mode), el('td', {}, r.environment), el('td', {}, pill('r-' + r.status, r.status)),
        el('td', {}, el('code', {}, (r.versions?.old || '–').slice(0, 8)), ' → ', el('code', {}, (r.versions?.new || '–').slice(0, 8))),
        el('td', {}, Object.entries(r.specs || {}).map(([k, v]) => el('div', {}, `${k}: ${v.total} (${v.passed || 0} ✓, ${v['known-bug-open'] || 0} known, ${v['new-regression'] || 0} new)`))),
        el('td', {}, (r.newFindings || []).join(', ') || '–'),
        el('td', {}, (r.possiblyFixed || []).join(', ') || '–'),
        el('td', {}, (r.notExplored || []).join('; ') || '–'))))));
    for (const r of DATA.runs.filter((x) => x.report).slice(0, 1)) {
      runsBox.append(el('h3', {}, 'Report of ' + r.runId), el('pre', {}, r.report));
    }
  }

  // Coverage
  const covBox = $('#tab-coverage');
  if (!DATA.coverage.length) covBox.append(el('div', { class: 'empty' }, 'No requirements checklist yet. Run the spec-assurance or prd-checklist skill.'));
  else {
    const covered = DATA.coverage.filter((c) => c.specs.length).length;
    covBox.append(el('p', {}, `${covered} of ${DATA.coverage.length} requirements have at least one spec. Coverage is counted by requirement, not by lines of code.`));
    covBox.append(el('table', {},
      el('thead', {}, el('tr', {}, ['App', 'Requirement', 'Rule', 'Spec', 'Last result', 'Assurance verdict'].map((h) => el('th', {}, h)))),
      el('tbody', {}, DATA.coverage.map((c) => el('tr', {},
        el('td', {}, c.app), el('td', {}, c.link ? link(c.link, c.requirement) : c.requirement, c.story ? el('div', { class: 'sub' }, c.story) : null),
        el('td', {}, c.text || '–'),
        el('td', {}, c.specs.length ? c.specs.map((s) => el('div', {}, el('code', {}, s.title))) : pill('r-new-regression', 'no spec')),
        el('td', {}, c.specs.map((s) => el('div', {}, pill('r-' + (s.last || 'none'), s.last || 'not run')))),
        el('td', {}, c.verdict ? pill(c.verdict === 'pass' ? 'r-passed' : c.verdict === 'fail' ? 'r-new-regression' : 'r-skipped', c.verdict) : '–'))))));
  }

  const h = location.hash.slice(1);
  if (h.startsWith('bug=')) { current = h.slice(4); showTab('bugs'); renderList(); select(current, true); }
  else {
    let saved = 'bugs';
    try { saved = localStorage.getItem('qa-board-tab') || 'bugs'; } catch (e) { /* storage blocked */ }
    showTab(['bugs', 'runs', 'coverage'].includes(h) ? h : saved);
    renderList();
  }
})();
</script>
</body>
</html>
