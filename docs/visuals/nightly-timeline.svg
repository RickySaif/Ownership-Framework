<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="theme.css" type="text/css"?>
<!-- A nightly routine on a timeline, with example times (hub time zone). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <rect class="bg" width="1280" height="400" rx="20"/>
  <text x="40" y="52" class="h2">A nightly run</text>
  <text x="40" y="80" class="body t-muted">Example times. Unattended, on a branch; everything it changes goes through a pull request.</text>

  <!-- axis: 01:30 → 06:00 over x 80..1200 (270 min → 1120 px, 4.148 px/min) -->
  <line x1="80" y1="250" x2="1200" y2="250" class="line" stroke-width="3"/>
  <g class="small t-muted">
    <text x="80" y="280" text-anchor="middle" class="small t-muted">01:30</text>
    <text x="246" y="280" text-anchor="middle" class="small t-muted">02:10</text>
    <text x="578" y="280" text-anchor="middle" class="small t-muted">03:30</text>
    <text x="910" y="280" text-anchor="middle" class="small t-muted">04:50</text>
    <text x="1076" y="280" text-anchor="middle" class="small t-muted">05:30</text>
    <text x="1200" y="280" text-anchor="middle" class="small t-red" font-weight="700">06:00</text>
  </g>

  <!-- segments -->
  <rect x="80" y="214" width="62" height="28" rx="6" class="panel-blue"/>
  <rect x="146" y="214" width="96" height="28" rx="6" class="panel-green"/>
  <rect x="246" y="214" width="660" height="28" rx="6" class="panel-teal"/>
  <rect x="910" y="214" width="162" height="28" rx="6" class="panel-amber"/>
  <rect x="1076" y="214" width="60" height="28" rx="6" class="panel"/>
  <rect x="1140" y="214" width="56" height="28" rx="6" class="panel"/>
  <rect x="1196" y="196" width="6" height="64" rx="3" class="fill-red"/>

  <!-- labels above -->
  <g>
    <line x1="111" y1="208" x2="111" y2="168" class="line"/>
    <text x="80" y="122" class="body" font-weight="700">1 · Preflight</text>
    <text x="80" y="142" class="small t-muted">sync the tip, sync:check,</text>
    <text x="80" y="160" class="small t-muted">login check</text>

    <line x1="194" y1="208" x2="194" y2="196" class="line"/>
    <text x="190" y="190" class="small t-green" font-weight="700">2 · All specs</text>

    <text x="576" y="122" text-anchor="middle" class="body" font-weight="700">3 · Explore only what changed</text>
    <text x="576" y="142" text-anchor="middle" class="small t-muted">git diff from the last tested commit to the new tip;</text>
    <text x="576" y="160" text-anchor="middle" class="small t-muted">one charter per changed area, biggest risk first; bug deliverables as findings are confirmed</text>
    <line x1="576" y1="208" x2="576" y2="168" class="line"/>

    <text x="991" y="122" text-anchor="middle" class="body" font-weight="700">4 · Wrap up findings</text>
    <text x="991" y="142" text-anchor="middle" class="small t-muted">videos, specs (strict-checked)</text>
    <line x1="991" y1="208" x2="991" y2="150" class="line"/>
  </g>
  <!-- labels below -->
  <g>
    <text x="1106" y="320" text-anchor="middle" class="small" font-weight="700">5 · Cleanup</text>
    <text x="1106" y="338" text-anchor="middle" class="small t-muted">from the ledger</text>
    <text x="1168" y="364" text-anchor="middle" class="small" font-weight="700">6 · Board</text>
    <text x="80" y="330" class="small t-muted">Red stops the line: a new regression in step 2 is reported before any exploring.</text>
    <text x="80" y="352" class="small t-muted">Hard stop at 06:00: whatever was not reached goes to notExplored and the run is marked inconclusive.</text>
  </g>
</svg>
