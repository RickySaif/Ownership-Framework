name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: Built-in scan (hosts, e-mails, tokens) over every version of every file
        run: node scripts/secret-scan.mjs --history

  check:
    name: Lint, validate, example specs (normal and strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run secret-scan
      - name: Example hub matches the templates
        run: npm run example:generate-check
      - name: Example bugs and runs match the schemas
        run: npm run example:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run example:sync
      - name: Regression specs (normal mode)
        run: npm run example:test
      - name: Full e2e suite
        run: npm run example:e2e
      - name: e2e coverage gate (100% of testable requirements)
        run: npm run example:coverage
      - name: Smoke specs
        run: npm run example:smoke
      - name: Strict mode fails only on the known bugs
        run: npm run example:strict
      - name: Board builds
        run: npm run example:board
      - name: README visuals present and under 500 KB
        run: npm run visuals:check
