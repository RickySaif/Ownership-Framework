<title>QA Board</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #0f766e; --brand-2: #14b8a6;
    --amber: #b45309; --amber-bg: #fef3c7; --red: #b91c1c; --red-bg: #fee2e2; --green: #15803d; --green-bg: #dcfce7; --blue: #1d4ed8; --blue-bg: #dbeafe;
    --code: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120; --panel: #111827; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2a3d; --brand: #2dd4bf; --brand-2: #14b8a6;
      --amber: #fbbf24; --amber-bg: #3a2a0a; --red: #fca5a5; --red-bg: #3b1212; --green: #86efac; --green-bg: #0f2e1b; --blue: #93c5fd; --blue-bg: #13233f;
      --code: #0f172a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1120; --panel: #111827; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2a3d; --brand: #2dd4bf; --brand-2: #14b8a6;
    --amber: #fbbf24; --amber-bg: #3a2a0a; --red: #fca5a5; --red-bg: #3b1212; --green: #86efac; --green-bg: #0f2e1b; --blue: #93c5fd; --blue-bg: #13233f;
    --code: #0f172a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; }
  nav.tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 14px; border-radius: 8px; font: inherit; cursor: pointer; }

  .banner.complete { border-left: 5px solid var(--green); }
  .banner.inconclusive { border-left: 5px solid var(--amber); }
  .banner.aborted { border-left: 5px solid var(--red); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sev-critical { background: var(--red); color: var(--bg); } .sev-high { background: var(--red-bg); color: var(--red); }
  .sev-medium { background: var(--amber-bg); color: var(--amber); } .sev-low { background: var(--blue-bg); color: var(--blue); }
  .st-open { background: var(--red-bg); color: var(--red); } .st-fixed { background: var(--green-bg); color: var(--green); }

  .r-passed, .r-complete { background: var(--green-bg); color: var(--green); } .r-new-regression, .r-error, .r-aborted { background: var(--red); color: var(--bg); }
  .r-known-bug-open, .r-inconclusive { background: var(--amber-bg); color: var(--amber); } .r-possibly-fixed { background: var(--blue-bg); color: var(--blue); }
  .r-flaky, .r-skipped, .r-none { background: var(--code); color: var(--muted); }

  .filters input { min-width: 220px; flex: 1; }
  .split { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 18px; align-items: start; }
  .list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .list button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); padding: 10px 14px; font: inherit; cursor: pointer; }
  .list button:last-child { border-bottom: 0; }
  .list button[aria-current="true"] { background: var(--code); box-shadow: inset 4px 0 0 var(--brand); }
  .list .id { font-weight: 700; margin-right: 6px; }
  .list .meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .detail { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 18px 22px; min-height: 300px; }
  .detail h2 { margin: 0 0 6px; font-size: 19px; }
  .detail h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .detail video { width: 100%; max-height: 420px; border-radius: 8px; background: #000; margin-top: 8px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  ol { padding-left: 20px; margin: 4px 0; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; max-height: 360px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 0; background: var(--brand); color: var(--bg); padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .copied { color: var(--green); font-weight: 600; align-self: center; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  a { color: var(--brand); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; }
  @media (max-width: 860px) {
    .split { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    nav.tabs { margin-left: 0; }
    main { padding: 16px; }
    .kv { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; }
  }
</style>

00 {\"status\":\"approved\",\"decided_by\":2}","state":"SELECT status, decided_by FROM requests WHERE id = 1 → approved, 2 (Ben). Read-only query on the local database.","byDesignCheck":"PRD R4 is explicit. Confirmed with the app owner (Dana, fictional) on 2026-10-25: not by design."},"related":[],"state":"open","hint":"In approveRequest, do what rejectRequest already does: refuse with 403 unless user.role is 'manager', and refuse with 403 when req.user_id === user.id. Check both before the UPDATE.","prd":"US-3 Decide","spec":"qa/acme-leave/specs/regression/approvals.spec.mjs","video":"qa/acme-leave/videos/AL-1-employee-approves-own-request.webm","environment":"local, commit e0eab5e4","foundAt":"2026-10-25","run":"20261025-0006-nightly","fixPrompt":"Fix bug AL-1 in acme-leave (../app, branch main).\n\n## The bug: An employee can approve their own leave request (and a colleague's)\nThe approve endpoint does not check who is calling. Any logged-in employee can approve their own request, or a colleague's, through the API. The page hides the Approve button, but the server accepts the call, so managers lose control over who is off.\n\nWhere: src/leave.mjs, function `approveRequest`\n\n## Why it is wrong\nRequirement R4 (US-3 Decide), apps/local/acme-leave/docs/prd.md#us-3-decide: Only a manager can approve, and nobody can decide their own request. Anyone else gets HTTP 403 and the request stays pending.\nActual: HTTP 200. The request is stored as approved with decided_by = Ben's own user id.\n\n## How it was confirmed\n- Response: POST /api/requests/1/approve as ben@acme.example → 200 {\"status\":\"approved\",\"decided_by\":2}\n- Stored state: SELECT status, decided_by FROM requests WHERE id = 1 → approved, 2 (Ben). Read-only query on the local database.\n- Not by design: PRD R4 is explicit. Confirmed with the app owner (Dana, fictional) on 2026-10-25: not by design.\n\n## Steps to reproduce\n1. Log in as Ben (employee).\n2. Request one day of leave, for example Monday 4 February 2030. It appears as pending.\n3. Send POST /api/requests/\u003cid>/approve as Ben (from the browser console, or any HTTP client with his session).\n4. Reload My leave: the request is approved and the balance went down by one day.\n\n## The fix\nIn approveRequest, do what rejectRequest already does: refuse with 403 unless user.role is 'manager', and refuse with 403 when req.user_id === user.id. Check both before the UPDATE.\n\n## Done when\n- The full e2e suite stays green (`npm run e2e`): it is the safety net that shows nothing else broke.\n- The regression spec `qa/acme-leave/specs/regression/approvals.spec.mjs` (test \"R4 an employee cannot approve their own request\", \"R4 an employee cannot approve a colleague's request\", \"R4 an employee cannot decide requests: no Team tab, and the API refuses\", \"R4 a manager cannot decide their own request\") passes with REGRESSION_STRICT=1. It is in the QA hub; copy it or ask the QA owner to run it against your branch.\n- Add or update a test in the app's own test suite for requirement R4.\n- No other behaviour changes. Do not edit the QA hub."},{"app":"acme-leave","id":"AL-2","title":"Weekend days are charged as leave","sev":"high","area":"requests","summary":"The length of a request counts calendar days instead of working days. A Friday-to-Monday request is charged as 4 days instead of 2, so employees lose leave they never take.","steps":["Log in as Cleo (employee).","Request leave from Friday 8 March 2030 to Monday 11 March 2030.","Look at the Days column in My requests: it says 4.","Have a manager approve it: the balance drops by 4."],"expected":{"text":"Only Monday to Friday count. Worked out by hand: Friday 8 + Monday 11 March 2030 = 2 working days; Saturday 9 and Sunday 10 do not count.","requirement":"R2","link":"apps/local/acme-leave/docs/prd.md#us-2-request-leave"},"actual":"The request is stored with days = 4, and an approval takes 4 days off the balance.","where":{"file":"src/leave.mjs","function":"countDays"},"how":{"response":"POST /api/requests {start: 2030-03-08, end: 2030-03-11} → 201 {\"days\":4}","state":"SELECT days FROM requests WHERE id = \u003cid> → 4. After approval GET /api/balance → used went up by 4.","byDesignCheck":"PRD R2 says working days only, with this exact example. Not by design."},"related":["AL-3"],"state":"open","hint":"Make countDays walk from start to end and count only days whose UTC weekday is Monday to Friday. Keep the result an integer. Public holidays are out of scope (PRD R2).","prd":"US-2 Request leave","spec":"qa/acme-leave/specs/regression/requests.spec.mjs","video":"qa/acme-leave/videos/AL-2-weekend-days-are-counted-as-leave.webm","environment":"local, commit e0eab5e4","foundAt":"2026-10-25","run":"20261025-0006-nightly","fixPrompt":"Fix bug AL-2 in acme-leave (../app, branch main).\n\n## The bug: Weekend days are charged as leave\nThe length of a request counts calendar days instead of working days. A Friday-to-Monday request is charged as 4 days instead of 2, so employees lose leave they never take.\n\nWhere: src/leave.mjs, function `countDays`\n\n## Why it is wrong\nRequirement R2 (US-2 Request leave), apps/local/acme-leave/docs/prd.md#us-2-request-leave: Only Monday to Friday count. Worked out by hand: Friday 8 + Monday 11 March 2030 = 2 working days; Saturday 9 and Sunday 10 do not count.\nActual: The request is stored with days = 4, and an approval takes 4 days off the balance.\n\n## How it was confirmed\n- Response: POST /api/requests {start: 2030-03-08, end: 2030-03-11} → 201 {\"days\":4}\n- Stored state: SELECT days FROM requests WHERE id = \u003cid> → 4. After approval GET /api/balance → used went up by 4.\n- Not by design: PRD R2 says working days only, with this exact example. Not by design.\n\n## Steps to reproduce\n1. Log in as Cleo (employee).\n2. Request leave from Friday 8 March 2030 to Monday 11 March 2030.\n3. Look at the Days column in My requests: it says 4.\n4. Have a manager approve it: the balance drops by 4.\n\n## The fix\nMake countDays walk from start to end and count only days whose UTC weekday is Monday to Friday. Keep the result an integer. Public holidays are out of scope (PRD R2).\n\n## Done when\n- The full e2e suite stays green (`npm run e2e`): it is the safety net that shows nothing else broke.\n- The regression spec `qa/acme-leave/specs/regression/requests.spec.mjs` (test \"R2 a Friday-to-Monday request counts 2 working days\", \"R2 a Friday-to-Monday request is charged 2 days, not the weekend\") passes with REGRESSION_STRICT=1. It is in the QA hub; copy it or ask the QA owner to run it against your branch.\n- Add or update a test in the app's own test suite for requirement R2.\n- No other behaviour changes. Do not edit the QA hub."},{"app":"acme-leave","id":"AL-3","title":"An end date before the start date is accepted, with negative days","sev":"medium","area":"requests","summary":"A request whose end date is before its start date is saved instead of refused. Its day count is negative, so if a manager approves it the employee's balance goes up.","steps":["Log in as Ben (employee).","Request leave from 15 March 2030 to 13 March 2030 (dates the wrong way round).","No error is shown; the request appears as pending with -1 days."],"expected":{"text":"The end date must be on or after the start date, and the request must contain at least one working day; otherwise HTTP 400 with a message, and nothing is saved.","requirement":"R3","link":"apps/local/acme-leave/docs/prd.md#us-2-request-leave"},"actual":"HTTP 201. The request is stored with days = -1 and status pending.","where":{"file":"src/leave.mjs","function":"createRequest"},"how":{"response":"POST /api/requests {start: 2030-03-15, end: 2030-03-13} → 201 {\"days\":-1}","state":"SELECT start_date, end_date, days FROM requests WHERE days \u003c 1 → 2030-03-15, 2030-03-13, -1.","byDesignCheck":"PRD R3 is explicit. Not by design."},"related":["AL-2"],"state":"open","hint":"In createRequest, after checking the dates are valid, refuse with 400 when end \u003c start, and (once AL-2 is fixed) when the working-day count is below 1. Do this before the balance check and the INSERT.","prd":"US-2 Request leave","spec":"qa/acme-leave/specs/regression/requests.spec.mjs","video":"qa/acme-leave/videos/AL-3-end-date-before-start-date-is-accepted.webm","environment":"local, commit e0eab5e4","foundAt":"2026-10-25","run":"20261025-0006-nightly","fixPrompt":"Fix bug AL-3 in acme-leave (../app, branch main).\n\n## The bug: An end date before the start date is accepted, with negative days\nA request whose end date is before its start date is saved instead of refused. Its day count is negative, so if a manager approves it the employee's balance goes up.\n\nWhere: src/leave.mjs, function `createRequest`\n\n## Why it is wrong\nRequirement R3 (US-2 Request leave), apps/local/acme-leave/docs/prd.md#us-2-request-leave: The end date must be on or after the start date, and the request must contain at least one working day; otherwise HTTP 400 with a message, and nothing is saved.\nActual: HTTP 201. The request is stored with days = -1 and status pending.\n\n## How it was confirmed\n- Response: POST /api/requests {start: 2030-03-15, end: 2030-03-13} → 201 {\"days\":-1}\n- Stored state: SELECT start_date, end_date, days FROM requests WHERE days \u003c 1 → 2030-03-15, 2030-03-13, -1.\n- Not by design: PRD R3 is explicit. Not by design.\n\n## Steps to reproduce\n1. Log in as Ben (employee).\n2. Request leave from 15 March 2030 to 13 March 2030 (dates the wrong way round).\n3. No error is shown; the request appears as pending with -1 days.\n\n## The fix\nIn createRequest, after checking the dates are valid, refuse with 400 when end \u003c start, and (once AL-2 is fixed) when the working-day count is below 1. Do this before the balance check and the INSERT.\n\n## Done when\n- The full e2e suite stays green (`npm run e2e`): it is the safety net that shows nothing else broke.\n- The regression spec `qa/a         el('td', {}, r.app), el('td', {}, r.mode), el('td', {}, r.environment), el('td', {}, pill('r-' + r.status, r.status)),
        el('td', {}, el('code', {}, (r.versions?.old || '–').slice(0, 8)), ' → ', el('code', {}, (r.versions?.new || '–').slice(0, 8))),
        el('td', {}, Object.entries(r.specs || {}).map(([k, v]) => el('div', {}, `${k}: ${v.total} (${v.passed || 0} ✓, ${v['known-bug-open'] || 0} known, ${v['new-regression'] || 0} new)`))),
        el('td', {}, (r.newFindings || []).join(', ') || '–'),
        el('td', {}, (r.possiblyFixed || []).join(', ') || '–'),
        el('td', {}, (r.notExplored || []).join('; ') || '–'))))));
    for (const r of DATA.runs.filter((x) => x.report).slice(0, 1)) {
      runsBox.append(el('h3', {}, 'Report of ' + r.runId), el('pre', {}, r.report));
    }
  }

  // Coverage
  const covBox = $('#tab-coverage');
  if (!DATA.coverage.length) covBox.append(el('div', { class: 'empty' }, 'No requirements checklist yet. Run the spec-assurance or prd-checklist skill.'));
  else {
    const covered = DATA.coverage.filter((c) => c.specs.length).length;
    covBox.append(el('p', {}, `${covered} of ${DATA.coverage.length} requirements have at least one spec. Coverage is counted by requirement, not by lines of code.`));
    covBox.append(el('table', {},
      el('thead', {}, el('tr', {}, ['App', 'Requirement', 'Rule', 'Spec', 'Last result', 'Assurance verdict'].map((h) => el('th', {}, h)))),
      el('tbody', {}, DATA.coverage.map((c) => el('tr', {},
        el('td', {}, c.app), el('td', {}, c.link ? link(c.link, c.requirement) : c.requirement, c.story ? el('div', { class: 'sub' }, c.story) : null),
        el('td', {}, c.text || '–'),
        el('td', {}, c.specs.length ? c.specs.map((s) => el('div', {}, el('code', {}, s.title))) : pill('r-new-regression', 'no spec')),
        el('td', {}, c.specs.map((s) => el('div', {}, pill('r-' + (s.last || 'none'), s.last || 'not run')))),
        el('td', {}, c.verdict ? pill(c.verdict === 'pass' ? 'r-passed' : c.verdict === 'fail' ? 'r-new-regression' : 'r-skipped', c.verdict) : '–'))))));
  }

  // Links like #runs, #coverage or #bug=AL-2 open that view, on load and when the hash changes.
  function route(first) {
    const h = location.hash.slice(1);
    if (h.startsWith('bug=')) {
      current = h.slice(4);
      showTab('bugs');
      renderList();
      select(current, true);
      return;
    }
    let saved = 'bugs';
    try { saved = localStorage.getItem('qa-board-tab') || 'bugs'; } catch (e) { /* storage blocked */ }
    showTab(['bugs', 'runs', 'coverage'].includes(h) ? h : first ? saved : 'bugs');
    if (first) renderList();
  }
  window.addEventListener('hashchange', () => route(false));
  route(true);
})();
</script>
</body>
</html>
